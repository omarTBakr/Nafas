# The local stack: `make up` (not plain `docker compose`; see the Makefile:
# Nafas runs on the native Docker engine, because Docker Desktop's VM cannot
# see the GPU).
#
# Infrastructure plus each service that exists so far. During development a
# service can equally run on the host (`uv run python -m nafas_gateway.main`)
# and reach the infrastructure on localhost. Credentials here are for a laptop
# only and match the defaults in nafas_core/config.py.
#
# Host ports are shifted off the usual ones (5433, 7234, 8234) so the stack
# sits beside a system Postgres or another project's Temporal without a fight.

services:
  postgres:
    # pgvector for embeddings; btree_gist (for the appointment exclusion
    # constraint) ships with Postgres and is enabled by the first migration
    # images pinned by digest (Phase 9): the same bytes on every machine; bump deliberately
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_USER: nafas
      POSTGRES_PASSWORD: nafas
      POSTGRES_DB: nafas
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nafas -d nafas"]
      interval: 5s
      timeout: 3s
      retries: 20

  temporal:
    # the single-binary dev server: frontend on 7234, web UI on 8234,
    # state in a SQLite file on the volume so workflows survive a restart
    # temporal CLI 1.9.1 (server 1.32.0, UI 2.54.1)
    image: temporalio/temporal@sha256:ad4c82c97bd12b417d1ea942610dbcd511afb250c4d5ed26c694009533df447e
    # the image's own user cannot write to a fresh named volume
    user: root
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--db-filename", "/data/temporal.db"]
    ports:
      - "7234:7233"
      - "8234:8233"
    volumes:
      - temporal-data:/data

  s3:
    # SeaweedFS as the local S3 (MinIO no longer publishes images). The app
    # only speaks S3, so production can point at any S3-compatible store.
    # Laptop credentials live in deploy/seaweedfs/s3.json; the bucket is
    # created by `uv run python -m scripts.init_storage`.
    # seaweedfs 4.47
    image: chrislusf/seaweedfs@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882
    command: ["server", "-dir=/data", "-s3", "-s3.port=8333", "-s3.config=/etc/seaweedfs/s3.json", "-ip.bind=0.0.0.0"]
    ports:
      - "8333:8333"
    volumes:
      - s3-data:/data
      - ./deploy/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro

  # --- services -----------------------------------------------------------

  llm:
    # Local Gemma through Ollama's OpenAI-compatible API, for a machine with no
    # Ollama of its own: `docker compose --profile ollama-container up` with
    # LLM_DOCKER_BASE_URL=http://llm:11434/v1. By default the services use the
    # host's Ollama instead (GPU, models already pulled), through
    # host.docker.internal. No host port: the host's Ollama owns 11434.
    profiles: ["ollama-container"]
    image: ollama/ollama:0.17.7
    environment:
      OLLAMA_KEEP_ALIVE: 5m
    command: ["serve"]
    volumes:
      - llm-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 3s
      retries: 20

  llm-model:
    profiles: ["ollama-container"]
    image: ollama/ollama:0.17.7
    entrypoint: ["/bin/sh", "-c"]
    # Pull every role model before an LLM consumer starts. They often share a
    # tag, which Ollama handles cheaply, but deployments may configure each
    # role independently.
    command:
      - >-
        if [ "$${LLM_PROVIDER}" != "ollama" ]; then exit 0; fi;
        for model in "$${LLM_CHAT_MODEL}" "$${LLM_CLASSIFIER_MODEL}" "$${LLM_SUMMARY_MODEL}"; do
          ollama pull "$${model}" || exit $$?;
        done
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-gemma4:e4b}
      LLM_CLASSIFIER_MODEL: ${LLM_CLASSIFIER_MODEL:-gemma4:e4b}
      LLM_SUMMARY_MODEL: ${LLM_SUMMARY_MODEL:-gemma4:e4b}
      OLLAMA_HOST: http://llm:11434
    depends_on:
      llm:
        condition: service_healthy

  gateway:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
        PACKAGE: nafas-gateway
        MODULE: nafas_gateway.main
    image: nafas/gateway:${IMAGE_TAG:-dev}
    environment: &service-env
      # the gateway's own login: the edge schema (shared rate limits) and nothing else;
      # every other service names its own below
      DATABASE_URL: postgresql+asyncpg://nafas_edge_svc:nafas@postgres:5432/nafas
      RATE_LIMITS_SHARED: "true"
      # web search grounding (Tavily); empty turns it off
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      WEB_SEARCH_DOCTOR: ${WEB_SEARCH_DOCTOR:-true}
      WEB_SEARCH_PATIENT: ${WEB_SEARCH_PATIENT:-false}
      TEMPORAL_HOST: temporal:7233
      S3_ENDPOINT_URL: http://s3:8333
      # the browser uploads and downloads straight from the store, by its published port
      S3_PUBLIC_ENDPOINT_URL: ${S3_PUBLIC_ENDPOINT_URL:-http://localhost:8333}
      DIALECT_ROUTER_URL: http://dialect-router:8410
      STT_URL: http://stt:8420
      TTS_URL: http://tts:8440
      EMBEDDINGS_PROVIDER: self_hosted
      EMBEDDINGS_URL: http://embeddings:8430
      CLINICAL_URL: http://clinical-records:8050
      CONSULTATION_URL: http://consultation:8060
      DOCTOR_ASSISTANT_URL: http://doctor-assistant:8020
      IDENTITY_URL: http://identity:8010
      SCHEDULING_URL: http://scheduling:8030
      CONVERSATION_URL: http://conversation:8040
      # laptop only; production injects a real secret
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-dev-internal-token}
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me-in-any-real-deployment}
      # /metrics asks for it; Prometheus reads the same value from deploy/prometheus/metrics-token.dev
      METRICS_TOKEN: ${METRICS_TOKEN:-dev-metrics-token}
      ENVIRONMENT: ${ENVIRONMENT:-dev}
      LOG_FORMAT: ${LOG_FORMAT:-text}
      # plain http on a laptop
      SESSION_COOKIE_SECURE: "false"
      # the gateway keys rate limits on the client address from X-Forwarded-For;
      # on a laptop any sender is trusted, in production only the web proxy
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
      # appointment emails go to Mailpit on a laptop (inbox on :8025)
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
      SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
      WEB_URL: ${WEB_URL:-http://localhost:8088}
      # LangSmith tracing; .env is not in the image, so each service gets it here.
      # Off unless LANGSMITH_TRACING=true and a key is set (nafas_core.tracing)
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-false}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-nafas-dev}
      LANGSMITH_ENDPOINT: ${LANGSMITH_ENDPOINT:-https://api.smith.langchain.com}
      LANGSMITH_HIDE_INPUTS: ${LANGSMITH_HIDE_INPUTS:-false}
      LANGSMITH_HIDE_OUTPUTS: ${LANGSMITH_HIDE_OUTPUTS:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      # Containers cannot use the host-side LLM_BASE_URL (localhost is the
      # container): they reach the host's Ollama through host.docker.internal,
      # or the llm container when LLM_DOCKER_BASE_URL says so.
      LLM_BASE_URL: ${LLM_DOCKER_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-gemma4:e4b}
      LLM_CLASSIFIER_MODEL: ${LLM_CLASSIFIER_MODEL:-gemma4:e4b}
      LLM_SUMMARY_MODEL: ${LLM_SUMMARY_MODEL:-gemma4:e4b}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  identity:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
        PACKAGE: nafas-identity
        MODULE: nafas_identity.main
    image: nafas/identity:${IMAGE_TAG:-dev}
    environment:
      <<: *service-env
      # its own login: this service's schema and no other (deploy/postgres/roles.sql)
      DATABASE_URL: postgresql+asyncpg://nafas_identity_svc:nafas@postgres:5432/nafas
    # internal API: published for development only; in production it is
    # reachable from the other services and nothing else
    ports:
      - "8010:8010"
    depends_on:
      postgres:
        condition: service_healthy

  scheduling:
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
        PACKAGE: nafas-scheduling
        MODULE: nafas_scheduling.main
    image: nafas/scheduling:${IMAGE_TAG:-dev}
    environment:
      <<: *service-env
      # its own login: this service's schema and no other (deploy/postgres/roles.sql)
      DATABASE_URL: postgresql+asyncpg://nafas_scheduling_svc:nafas@postgres:5432/nafas
    ports:
      - "8030:8030"
    depends_on:
      postgres:
        condition: service_healthy

  conversation:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # the worker (messages arrive as updates on PatientConversationWorkflow)
    # and a read-only internal API for the threads
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
        PACKAGE: nafas-conversation
        MODULE: nafas_conversation.main
    image: nafas/conversation:${IMAGE_TAG:-dev}
    environment:
      <<: *service-env
      DATABASE_URL: postgresql+asyncpg://nafas_conversation_svc:nafas@postgres:5432/nafas
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_BASE_URL: ${LLM_DOCKER_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-gemma4:e4b}
      LLM_CLASSIFIER_MODEL: ${LLM_CLASSIFIER_MODEL:-gemma4:e4b}
      LLM_SUMMARY_MODEL: ${LLM_SUMMARY_MODEL:-gemma4:e4b}
    ports:
      - "8040:8040"
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      identity:
        condition: service_started
      scheduling:
        condition: service_started

  web:
    # the built app behind nginx; for development with hot reload, run
    # `npm run dev` in web/ instead (port 5173, proxying /api the same way)
    build: ./web
    image: nafas/web:${IMAGE_TAG:-dev}
    ports:
      - "8088:80"
    depends_on:
      - gateway

  dialect-router:
    # GPU: needs the NVIDIA container toolkit's CDI devices, which the native
    # engine has and Docker Desktop does not. Without a GPU, `make up-cpu`.
    build: ./services/dialect_router
    image: nafas/dialect-router:${IMAGE_TAG:-dev}
    ports:
      - "8410:8410"
    devices:
      - nvidia.com/gpu=all

  stt:
    # GPU, like the dialect-router; `make up-cpu` runs it on the CPU instead
    build: ./services/stt
    image: nafas/stt:${IMAGE_TAG:-dev}
    ports:
      - "8420:8420"
    devices:
      - nvidia.com/gpu=all

  tts:
    # GPU; speaks booking and admin messages only, in the patient's dialect
    build: ./services/tts
    image: nafas/tts:${IMAGE_TAG:-dev}
    ports:
      - "8440:8440"
    devices:
      - nvidia.com/gpu=all

  doctor-assistant:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # the doctor's chat about their patients, streamed; owns no schema and no database login
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
        PACKAGE: nafas-doctor-assistant
        MODULE: nafas_doctor_assistant.main
    image: nafas/doctor-assistant:${IMAGE_TAG:-dev}
    environment:
      <<: *service-env
      # no database: it reads through the services that own the data
      DATABASE_URL: ""
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_BASE_URL: ${LLM_DOCKER_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-gemma4:e4b}
      LLM_CLASSIFIER_MODEL: ${LLM_CLASSIFIER_MODEL:-gemma4:e4b}
      LLM_SUMMARY_MODEL: ${LLM_SUMMARY_MODEL:-gemma4:e4b}
    ports:
      - "8020:8020"

  embeddings:
    # bge-m3 on the CPU: the GPU is spent on stt, the dialect-router and tts
    build: ./services/embeddings
    image: nafas/embeddings:${IMAGE_TAG:-dev}
    ports:
      - "8430:8430"

  clinical-records:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
        PACKAGE: nafas-clinical-records
        MODULE: nafas_clinical.main
        # scanned pages and images are read by OCR, in Arabic and English
        SYSTEM_PACKAGES: tesseract-ocr tesseract-ocr-ara tesseract-ocr-eng
    image: nafas/clinical-records:${IMAGE_TAG:-dev}
    environment:
      <<: *service-env
      DATABASE_URL: postgresql+asyncpg://nafas_clinical_svc:nafas@postgres:5432/nafas
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_BASE_URL: ${LLM_DOCKER_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-gemma4:e4b}
      LLM_CLASSIFIER_MODEL: ${LLM_CLASSIFIER_MODEL:-gemma4:e4b}
      LLM_SUMMARY_MODEL: ${LLM_SUMMARY_MODEL:-gemma4:e4b}
    ports:
      - "8050:8050"
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started
      embeddings:
        condition: service_started

  consultation:
    extra_hosts:
      - "host.docker.internal:host-gateway"
    build:
      context: .
      dockerfile: docker/service.Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-}
        PACKAGE: nafas-consultation
        MODULE: nafas_consultation.main
    image: nafas/consultation:${IMAGE_TAG:-dev}
    environment:
      <<: *service-env
      DATABASE_URL: postgresql+asyncpg://nafas_consultation_svc:nafas@postgres:5432/nafas
      # the SOAP draft is written by the summary model (LLM_SUMMARY_MODEL)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_BASE_URL: ${LLM_DOCKER_BASE_URL:-http://host.docker.internal:11434/v1}
      LLM_API_KEY: ${LLM_API_KEY:-ollama}
      LLM_CHAT_MODEL: ${LLM_CHAT_MODEL:-gemma4}
      LLM_CLASSIFIER_MODEL: ${LLM_CLASSIFIER_MODEL:-gemma4}
      LLM_SUMMARY_MODEL: ${LLM_SUMMARY_MODEL:-gemma4}
    ports:
      - "8060:8060"
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_started

  # `docker compose --profile monitoring up`: metrics, alerts and dashboards on a laptop
  prometheus:
    profiles: [monitoring]
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./deploy/prometheus/metrics-token.dev:/etc/prometheus/metrics-token:ro
    ports:
      - "9090:9090"

  grafana:
    profiles: [monitoring]
    image: grafana/grafana:12.1.0@sha256:6ac590e7cabc2fbe8d7b8fc1ce9c9f0582177b334e0df9c927ebd9670469440f
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

  mailpit:
    # catches every email on a laptop; nothing leaves the machine
    image: axllent/mailpit@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  postgres-data:
  temporal-data:
  s3-data:
  llm-data:
