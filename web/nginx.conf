server {
    listen 80;
    root /usr/share/nginx/html;

    # Docker's DNS, asked again every 10 s. nginx otherwise resolves the gateway
    # once at start and keeps that IP: a recreated gateway container gets a new
    # one, and every /api call then fails with 502 until nginx restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $gateway http://gateway:8000;

    # the gateway, reached by its compose service name
    location /api/ {
        # a variable makes nginx resolve per request, through the resolver above
        proxy_pass $gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # the doctor assistant streams its answer: pass it through as it comes
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # hashed assets never change, so cache them hard
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # client-side routes (/book/..., /doctor) all load the app
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
