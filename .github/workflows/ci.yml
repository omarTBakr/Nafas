name: CI

on:
  # every branch, not just main: a feature branch with no CI is a branch
  # whose checks you only discover are broken at merge time
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    # the database tests skip without a Postgres; here they must run
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nafas
          POSTGRES_PASSWORD: nafas
          POSTGRES_DB: nafas
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U nafas -d nafas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      # the email tests send through it
      mailpit:
        image: axllent/mailpit@sha256:74d609a42ec279aa63c6b4622a6fa9b5408d1ad5b1d76a1c4be40a265ce0863d
        ports:
          - 1025:1025
          - 8025:8025

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Check formatting with black
        run: uv run black --check --diff .

      - name: Lint with ruff
        run: uv run ruff check --output-format=github .

      # scanned pages and images are read by OCR in clinical-records' tests
      - name: Install tesseract
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-ara

      # the storage tests need an S3; SeaweedFS as in docker-compose (a service
      # container cannot be given its command, so it is started here)
      - name: Start S3
        run: |
          docker run -d --name s3 -p 8333:8333 \
            -v "$PWD/deploy/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs@sha256:ce9e796f1fe6f06968f4c04bdaf8f678dad9c8acdfef3d244133d71bfa6bf882 \
            server -dir=/data -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -ip.bind=0.0.0.0
          for i in $(seq 1 60); do curl -s -o /dev/null http://localhost:8333 && exit 0; sleep 2; done
          docker logs s3; exit 1

      - name: Run tests
        # the database and workflow tests must run here, never skip
        env:
          NAFAS_REQUIRE_SERVICES: "1"
        run: uv run pytest

      # a model changed without a migration, or the reverse, fails here
      - name: Migrations match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check

      # GPU services keep their own environment; their API suite needs no GPU
      # and no model runtime
      - name: Run dialect-router tests
        working-directory: services/dialect_router
        run: uv run pytest

      # decoding is real, so ffmpeg is needed; the model is not
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run stt tests
        working-directory: services/stt
        run: uv run pytest

      - name: Run tts tests
        working-directory: services/tts
        run: uv run pytest

      - name: Run embeddings tests
        working-directory: services/embeddings
        run: uv run pytest

  # the safety eval set against the real model: on only once the repository
  # has an ANTHROPIC_API_KEY secret; its plain-code checks run in `ci` anyway
  safety-eval:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      NAFAS_RUN_EVALS: "1"
    steps:
      - uses: actions/checkout@v4
        if: env.ANTHROPIC_API_KEY != ''
      - uses: astral-sh/setup-uv@v5
        if: env.ANTHROPIC_API_KEY != ''
        with:
          enable-cache: true
      - name: Run the safety eval
        if: env.ANTHROPIC_API_KEY != ''
        run: |
          uv python install
          uv sync --dev
          uv run pytest services/conversation/tests/test_safety_eval.py -k real_model
      - name: Keep the report
        if: env.ANTHROPIC_API_KEY != '' && always()
        uses: actions/upload-artifact@v4
        with:
          name: safety-eval
          path: services/conversation/evals/last-run.json
          if-no-files-found: ignore
      - name: No key, no eval
        if: env.ANTHROPIC_API_KEY == ''
        run: echo "ANTHROPIC_API_KEY is not set for this repository; the model eval was skipped"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  monitoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Alert rules parse and fire as their tests expect
        run: |
          docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/p" -w /p prom/prometheus:v3.5.0 check rules alerts.yml
          docker run --rm --entrypoint promtool -v "$PWD/deploy/prometheus:/p" -w /p prom/prometheus:v3.5.0 test rules alerts_test.yml
      - name: The dashboard is valid JSON
        run: python3 -m json.tool deploy/grafana/dashboards/nafas-overview.json > /dev/null
      - name: The production compose file resolves, and refuses to without its secrets
        run: |
          docker compose -f docker-compose.yml -f docker-compose.prod.yml --env-file deploy/ci/placeholder.env config -q
          ! docker compose -f docker-compose.yml -f docker-compose.prod.yml config -q 2>/dev/null

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: A service image builds from its pinned bases and reports its commit
        run: |
          docker build -f docker/service.Dockerfile \
            --build-arg PACKAGE=nafas-gateway --build-arg MODULE=nafas_gateway.main \
            --build-arg GIT_SHA="${GITHUB_SHA::7}" -t nafas/gateway:ci .
          test "$(docker run --rm nafas/gateway:ci printenv GIT_SHA)" = "${GITHUB_SHA::7}"
          docker run --rm nafas/gateway:ci test -f /app/release_check.py
