name: CI

on:
  # every branch, not just main: a feature branch with no CI is a branch
  # whose checks you only discover are broken at merge time
  push:
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    # the database tests skip without a Postgres; here they must run
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: nafas
          POSTGRES_PASSWORD: nafas
          POSTGRES_DB: nafas
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U nafas -d nafas"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Check formatting with black
        run: uv run black --check --diff .

      - name: Lint with ruff
        run: uv run ruff check --output-format=github .

      - name: Run tests
        run: uv run pytest

      # a model changed without a migration, or the reverse, fails here
      - name: Migrations match the models
        run: |
          uv run alembic upgrade head
          uv run alembic check

      # GPU services keep their own environment; their API suite needs no GPU
      # and no model runtime
      - name: Run dialect-router tests
        working-directory: services/dialect_router
        run: uv run pytest

      # decoding is real, so ffmpeg is needed; the model is not
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Run stt tests
        working-directory: services/stt
        run: uv run pytest

      - name: Run tts tests
        working-directory: services/tts
        run: uv run pytest

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
