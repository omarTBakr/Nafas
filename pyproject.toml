[project]
name = "nafas"
version = "0.1.0"
description = "AI assistant for patients and doctors: one repository, one service per domain"
readme = "README.md"
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.12"
# the workspace root is not a package; depending on every member makes a
# plain `uv sync` install them all (editable) for development and the suite
dependencies = [
    "nafas-core",
    "nafas-gateway",
    "nafas-identity",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/*"]
# GPU services carry their own CUDA-pinned lockfile and never share this one
exclude = ["services/dialect_router"]

[tool.uv.sources]
nafas-core = { workspace = true }
nafas-gateway = { workspace = true }
nafas-identity = { workspace = true }

[dependency-groups]
dev = [
    "black>=26.5.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
]

[tool.black]
line-length = 130
target-version = ["py312"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
# every workspace package, and the dev scripts
known-first-party = ["nafas_*", "dialect_router", "scripts"]

# the migrations folder is named alembic/ too; without this the library is
# filed as first-party
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection idiom puts these calls in argument defaults
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Body"]

[tool.pytest.ini_options]
testpaths = ["packages", "services"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# importlib: every package has a tests/ with a test_app.py or similar, and
# the default mode would collide on the duplicate basenames
addopts = "-q --import-mode=importlib"
