[project]
name = "nafas-scheduling"
version = "0.1.0"
description = "Doctors' hours and appointments, checked to the minute"
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "nafas-core",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv.sources]
nafas-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
