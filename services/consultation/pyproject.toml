[project]
name = "nafas-consultation"
version = "0.1.0"
description = "In-person visits: the recording, its transcript, the SOAP draft the doctor reviews, and filing it to the record"
license = "PolyForm-Noncommercial-1.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "livekit-api>=1.2.1",
    "nafas-core",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv.sources]
nafas-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
module-name = "nafas_consultation"
