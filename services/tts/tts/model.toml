# The models this service serves, pinned. Changing any line here is a model
# change: it goes through the eval gate and promotion (docs/PLAN.md §6b).

# 13 dialects; the dialect is OmniVoice's `language` ("egyptian lahgtna")
model_id = "oddadmix/lahgtna-omnivoice-v2"
model_revision = "55c38a613e316499829eef60b006edc6da9499e2"
model_dir = "/models/tts"

# the audio codec the model speaks through, loaded from <model_dir>/audio_tokenizer;
# without it the library fetches it from the Hub at start, which offline fails
audio_tokenizer_id = "eustlb/higgs-audio-v2-tokenizer"
audio_tokenizer_revision = "528e871c2a26c4f0f7773b9754e2e1acae20899d"

# Egyptian only, with its two trained voices: served for "eg" only once it
# wins the side-by-side listening test against v2 (docs/CHECKLIST.md)
egyptian_model_id = "ehabnegm/lahgtna-omnivoice-egyptian-v3"
egyptian_model_revision = "e859e1f49e2d45eb0d6dfc48e48e03697dfccc65"
egyptian_model_dir = "/models/tts-egyptian"
use_egyptian_model = false

# a spoken booking or admin message, never a long answer
max_chars = 600
num_step = 32
