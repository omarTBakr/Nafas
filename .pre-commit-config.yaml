# Runs on every `git commit`. Install once with: uv run pre-commit install
repos:
  - repo: https://github.com/psf/black
    rev: 26.5.1
    hooks:
      - id: black

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.6
    hooks:
      - id: ruff
        args: [--fix]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        # compose's own `!reset` tag is not plain YAML; `docker compose config` validates it
        exclude: ^docker-compose\.cpu\.yml$
      - id: check-toml
      - id: check-added-large-files
        # a lockfile is legitimately large once the dependency tree grows
        args: [--maxkb=1024]
      - id: detect-private-key

  # runs the suite locally before the commit is created
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        types: [python]

      - id: pytest-dialect-router
        name: pytest (dialect-router)
        entry: bash -c 'cd services/dialect_router && uv run pytest'
        language: system
        pass_filenames: false
        files: ^services/dialect_router/

      # a hand-maintained table of contents drifts; this one is generated
      - id: readme-contents
        name: README contents are up to date
        entry: uv run python scripts/toc.py --check
        language: system
        pass_filenames: false
        files: ^README\.md$
