# Scrapes every service's /metrics (nafas_core.metrics). `make monitoring` runs
# it beside the stack; production points the same jobs at its own addresses.
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: nafas
    static_configs:
      - targets:
          - gateway:8000
          - identity:8010
          - doctor-assistant:8020
          - scheduling:8030
          - conversation:8040
          - clinical-records:8050
          - consultation:8060
    # the gateway is public; its /metrics sits behind METRICS_TOKEN
    authorization:
      credentials_file: /etc/prometheus/metrics-token
